<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kniffel Extreme</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#13131c;--sf:#1e1e2e;--s2:#26263a;--bd:#32324a;--red:#ff4d2e;--gold:#f5c842;--blue:#5b7fff;--green:#2ecc8a;--text:#f2eff9;--mu:#7070a0;--dim:#45455e;--r:16px;--rs:12px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif;}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
.screen{display:none;flex-direction:column;height:100%;}
.screen.active{display:flex;}
#L{align-items:center;overflow-y:auto;padding:24px 16px 48px;gap:16px;background:radial-gradient(ellipse 80% 45% at 50% -5%,rgba(255,77,46,.22) 0%,transparent 65%),var(--bg);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:62px;letter-spacing:5px;color:var(--red);line-height:1;text-align:center;text-shadow:0 0 50px rgba(255,77,46,.5);}
.logo-s{font-size:11px;letter-spacing:5px;color:var(--mu);text-transform:uppercase;text-align:center;margin-top:2px;}
.lcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px;width:100%;max-width:390px;display:flex;flex-direction:column;gap:11px;}
.lbl{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--mu);}
.inp{background:var(--s2);border:1.5px solid var(--bd);border-radius:var(--rs);padding:13px 16px;color:var(--text);font-size:16px;font-family:'Nunito',sans-serif;font-weight:700;width:100%;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--blue);}
.bet-g{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.bo{padding:10px 4px;border-radius:var(--rs);border:1.5px solid var(--bd);background:var(--s2);color:var(--mu);font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;font-family:'Nunito',sans-serif;}
.bo.sel{border-color:var(--gold);background:rgba(245,200,66,.12);color:var(--gold);}
.divider{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;font-weight:700;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bd);}
.conn-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);font-weight:600;padding:4px 0;}
.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.cdot-on{background:var(--green);box-shadow:0 0 7px var(--green);}
.cdot-off{background:var(--dim);}
.cdot-wait{background:var(--gold);animation:cpulse .8s infinite;}
@keyframes cpulse{50%{opacity:.3}}
.dp span{animation:dp 1.2s infinite;}.dp span:nth-child(2){animation-delay:.2s;}.dp span:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{opacity:.15}40%{opacity:1}}
.btn{padding:13px 20px;border-radius:var(--rs);font-size:14px;font-weight:700;font-family:'Nunito',sans-serif;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{transform:scale(.95);}
.btn:disabled{opacity:.35;transform:none;cursor:default;}
.btn-p{background:linear-gradient(135deg,#ff4d2e,#ff7855);color:#fff;width:100%;font-size:15px;padding:15px;box-shadow:0 4px 20px rgba(255,77,46,.3);}
.btn-b{background:rgba(91,127,255,.15);border:1.5px solid var(--blue);color:#8ba3ff;width:100%;}
.btn-gh{background:var(--s2);border:1.5px solid var(--bd);color:var(--mu);}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:10px;}
#G{flex-direction:column;}
.ghdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 8px;border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0;}
.glogo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--red);}
.hr{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
.chip{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 5px rgba(255,77,46,.4);}
.chip.u{background:var(--bd);box-shadow:none;}
.sp{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.sp-y{background:rgba(91,127,255,.2);color:#8ba3ff;border:1px solid rgba(91,127,255,.3);}
.sp-o{background:rgba(46,204,138,.2);color:var(--green);border:1px solid rgba(46,204,138,.3);}
.sp-b{background:rgba(245,200,66,.15);color:var(--gold);border:1px solid rgba(245,200,66,.3);font-size:10px;}
.scroll{flex:1;overflow-y:auto;padding:12px 12px 110px;display:flex;flex-direction:column;gap:12px;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;}
.tbadge{display:inline-block;font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;margin-bottom:10px;letter-spacing:.5px;}
.tb-y{background:rgba(91,127,255,.2);color:#8ba3ff;}
.tb-o{background:rgba(46,204,138,.2);color:var(--green);}
.tb-b{background:rgba(112,112,160,.15);color:var(--mu);}
.stxt{font-size:13px;color:var(--mu);min-height:18px;margin-bottom:10px;line-height:1.5;font-weight:600;}
.drow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
.die{width:72px;height:72px;border-radius:16px;border:2.5px solid var(--bd);background:linear-gradient(145deg,var(--s2),#1a1a28);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;position:relative;transition:all .2s;box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);}
.die .face{font-size:34px;line-height:1;}
.die .dlbl{font-size:8px;font-weight:800;letter-spacing:1.5px;color:var(--mu);margin-top:2px;text-transform:uppercase;}
.die:active{transform:scale(.91);}
.die.kept{border-color:var(--blue);background:linear-gradient(145deg,rgba(91,127,255,.22),rgba(91,127,255,.08));box-shadow:0 0 18px rgba(91,127,255,.3),0 4px 14px rgba(0,0,0,.3);}
.die.kept::after{content:'✓';position:absolute;top:3px;right:6px;font-size:10px;font-weight:800;color:var(--blue);}
.die.rd{border-color:rgba(220,60,30,.5);color:#ff6040;}
.die.rd .dlbl{color:#ff6040;}
.die.rd.kept{border-color:var(--red);background:linear-gradient(145deg,rgba(255,77,46,.22),rgba(255,77,46,.07));box-shadow:0 0 18px rgba(255,77,46,.3);}
@keyframes tumble{0%{transform:scale(1.3) rotate(-22deg);filter:blur(1px);}18%{transform:scale(.8) rotate(16deg);filter:blur(0);}35%{transform:scale(1.14) rotate(-10deg);}55%{transform:scale(.93) rotate(6deg);}75%{transform:scale(1.05) rotate(-3deg);}100%{transform:scale(1) rotate(0);}}
.die.rolling{animation:tumble .48s cubic-bezier(.36,.07,.19,.97);}
@keyframes numFlash{0%,100%{opacity:1}50%{opacity:.2;transform:scale(.6);}}
.die.rolling .face{animation:numFlash .07s linear infinite;}
.sbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.snum{font-family:'Bebas Neue',sans-serif;font-size:28px;background:var(--s2);padding:2px 16px;border-radius:20px;border:1px solid var(--bd);color:var(--text);letter-spacing:1px;}
.ht{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;}
.ht-g{background:rgba(46,204,138,.15);color:var(--green);border:1px solid rgba(46,204,138,.3);}
.ht-b{background:rgba(91,127,255,.15);color:#8ba3ff;border:1px solid rgba(91,127,255,.3);}
.qrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
.qbtn{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;border:1.5px solid var(--blue);background:rgba(91,127,255,.12);color:#8ba3ff;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s;}
.qbtn:active{transform:scale(.93);}
.qbtn.knf{border-color:var(--red);background:rgba(255,77,46,.12);color:#ff8066;}
.arow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.btn-roll{background:linear-gradient(135deg,#ff4d2e,#ff7855);color:#fff;font-size:16px;font-weight:800;padding:14px 22px;box-shadow:0 4px 18px rgba(255,77,46,.4);border-radius:var(--rs);}
.btn-roll:disabled{background:var(--s2);box-shadow:none;color:var(--mu);}
.btn-chip{background:rgba(255,77,46,.12);border:1.5px solid var(--red);color:#ff8066;padding:11px 16px;border-radius:var(--rs);}
.btn-wert{background:var(--s2);border:1.5px solid var(--bd);color:var(--text);padding:11px 16px;border-radius:var(--rs);}
.btn-stk{background:var(--s2);border:1.5px solid var(--bd);color:var(--mu);padding:11px 16px;border-radius:var(--rs);}
.btn-stk.on{background:rgba(255,77,46,.1);border-color:var(--red);color:#ff8066;}
.btn-new{background:var(--s2);border:1.5px solid var(--bd);color:var(--mu);font-size:12px;padding:9px 13px;border-radius:var(--rs);}
.ban{border-radius:var(--rs);padding:10px 14px;font-size:12px;font-weight:600;margin:8px 0;line-height:1.5;}
.ban-s{background:rgba(255,77,46,.08);border:1px solid rgba(255,77,46,.25);color:#ff9a7a;}
.ban-cf{background:rgba(255,77,46,.08);border:1px solid rgba(255,77,46,.25);color:#ff9a7a;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;}
.shdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.shdr-t{font-size:14px;font-weight:800;}
.shdr-n{font-size:10px;color:var(--mu);font-weight:700;}
.slbl{font-size:9px;font-weight:800;letter-spacing:2.5px;color:var(--mu);text-transform:uppercase;padding:7px 4px 4px;border-bottom:1px solid var(--bd);}
.sr{display:flex;align-items:center;padding:7px 4px;border-bottom:1px solid rgba(50,50,74,.4);border-radius:8px;cursor:default;transition:background .12s;}
.sr.can{cursor:pointer;}.sr.can:active{background:rgba(91,127,255,.08);}
.sr.stk{cursor:pointer;}.sr.stk:active{background:rgba(255,77,46,.07);}
.cn{flex:1;font-size:12px;font-weight:600;}.cfx{font-size:9px;color:var(--mu);margin-left:3px;}
.cv{min-width:44px;text-align:right;font-size:12px;font-weight:700;}
.cv.prev{color:var(--blue);font-style:italic;}.cv.scrd{color:var(--text);}.cv.zero{color:var(--dim);}.cv.spv{color:var(--red);font-style:italic;}.cv.emp{color:var(--dim);}
.kb{display:inline-block;font-size:9px;font-weight:800;background:var(--gold);color:#1a1000;padding:1px 5px;border-radius:6px;margin-left:3px;}
.bonrow{padding:5px 4px;font-size:11px;color:var(--mu);font-weight:600;display:flex;align-items:center;border-bottom:1px solid var(--bd);}
.totrow{padding:9px 4px;display:flex;align-items:center;font-weight:800;font-size:15px;}
.gow{text-align:center;padding:32px 16px;}
.got{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;color:var(--red);margin-bottom:6px;text-shadow:0 0 30px rgba(255,77,46,.4);}
.gos{display:flex;justify-content:center;gap:40px;margin-bottom:28px;}
.gob .gn{font-size:11px;color:var(--mu);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.gob .gp{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:2px;}
.gob.win .gp{color:var(--gold);text-shadow:0 0 30px rgba(245,200,66,.4);}
.betres{font-size:15px;font-weight:800;color:var(--gold);margin-bottom:20px;}
.think{text-align:center;padding:20px;color:var(--mu);font-size:14px;font-weight:600;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:11px 20px;font-size:13px;font-weight:700;color:var(--text);z-index:200;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.5);}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="screen active" id="L">
  <div class="logo">Kniffel<br>Extreme</div>
  <div class="logo-s">Multiplayer Edition</div>
  <div class="lcard">
    <div class="lbl">Dein Name</div>
    <input class="inp" id="nameIn" maxlength="14" placeholder="Spielername">
  </div>
  <div class="lcard">
    <div class="lbl">Einsatz 💰</div>
    <div class="bet-g">
      <div class="bo sel" data-v="0"  onclick="setBet(0)">Kein</div>
      <div class="bo"    data-v="5"   onclick="setBet(5)">5 €</div>
      <div class="bo"    data-v="10"  onclick="setBet(10)">10 €</div>
      <div class="bo"    data-v="20"  onclick="setBet(20)">20 €</div>
      <div class="bo"    data-v="50"  onclick="setBet(50)">50 €</div>
      <div class="bo"    data-v="100" onclick="setBet(100)">100 €</div>
    </div>
    <input class="inp" id="betCustom" type="number" min="0" placeholder="Eigener Betrag (€)" style="margin-top:4px;" oninput="setBet(parseInt(this.value)||0,true)">
  </div>
  <div class="lcard">
    <div class="lbl">Spielmodus</div>
    <button class="btn btn-p" onclick="vsBot()">🤖 Gegen Bot spielen</button>
    <div class="divider">oder Multiplayer</div>
    <div class="conn-row"><span class="cdot cdot-off" id="connDot"></span><span id="connTxt">Nicht verbunden</span></div>
    <input class="inp" id="roomIn" placeholder="4-stelliger Code z.B. AB12" maxlength="4"
      style="text-transform:uppercase;letter-spacing:4px;font-weight:800;font-size:24px;text-align:center;"
      oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
    <div style="display:flex;gap:8px;">
      <button class="btn btn-p" style="flex:1" onclick="createRoom()">🏠 Raum erstellen</button>
      <button class="btn btn-b"  style="flex:1;width:auto;" onclick="joinRoom()">🚪 Beitreten</button>
    </div>
    <div style="font-size:11px;color:var(--mu);font-weight:600;line-height:1.6;">
      Beide öffnen denselben Link, geben denselben Code ein. Einer erstellt den Raum, der andere tritt bei.
    </div>
  </div>
</div>

<div class="screen" id="G">
  <div class="ghdr">
    <div class="glogo">K. EXTREME</div>
    <div class="hr">
      <div id="chipRow" style="display:flex;gap:4px;"></div>
      <div id="betBadge"></div>
      <div id="scorePills"></div>
    </div>
  </div>
  <div class="scroll" id="SA"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// MULTIPLAYER — Firebase Realtime Database (free)
// No account needed for users, just open the link
// ═══════════════════════════════════════════════
const FB_URL = 'https://kniffel-extreme-default-rtdb.europe-west1.firebasedatabase.app';

let myBet=0, myName='Spieler', gameMode='bot';
let wsRoom='', wsIsHost=false, pollTimer=null, lastMsgId='';

function setStatus(state,txt){
  document.getElementById('connDot').className='cdot cdot-'+state;
  document.getElementById('connTxt').textContent=txt;
}

async function fbSet(path,data){
  try{
    await fetch(FB_URL+path+'.json',{method:'PUT',body:JSON.stringify(data),headers:{'Content-Type':'application/json'}});
  }catch(e){}
}
async function fbGet(path){
  try{
    const r=await fetch(FB_URL+path+'.json');
    return await r.json();
  }catch(e){return null;}
}
async function fbPush(path,data){
  try{
    await fetch(FB_URL+path+'.json',{method:'POST',body:JSON.stringify({...data,ts:Date.now()}),headers:{'Content-Type':'application/json'}});
  }catch(e){}
}

function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(pollMessages,1200);
}
function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}

async function pollMessages(){
  const msgs=await fbGet('/rooms/'+wsRoom+'/msgs');
  if(!msgs)return;
  const entries=Object.entries(msgs).sort((a,b)=>a[1].ts-b[1].ts);
  for(const [key,msg] of entries){
    if(key<=lastMsgId)continue;
    lastMsgId=key;
    if(msg.from===myName)continue; // ignore own messages
    handleMsg(msg);
  }
}

function sendMsg(data){
  fbPush('/rooms/'+wsRoom+'/msgs',{...data,from:myName});
}

function handleMsg(data){
  if(data.type==='join'&&wsIsHost){
    const players=[{id:'host',name:myName,isBot:false},{id:'guest',name:data.name,isBot:false}];
    const bet=Math.max(myBet,data.bet||0);
    sendMsg({type:'start',players,bet});
    setStatus('on',data.name+' beigetreten!');
    showToast('🎉 '+data.name+' ist beigetreten!');
    startGame(players,bet,true);
  } else if(data.type==='start'&&!wsIsHost){
    setStatus('on','Verbunden! Spiel startet…');
    showToast('Spiel startet!');
    startGame(data.players,data.bet,false);
  } else if(data.type==='move'){
    applyMove(data);
  }
}

function createRoom(){
  const room=getRoom();if(!room)return;
  wsRoom=room;wsIsHost=true;myName=getName();
  setStatus('wait','Warte auf Mitspieler…');
  // Clear old room data
  fbSet('/rooms/'+room,{created:Date.now()});
  lastMsgId='';
  startPolling();
  showToast('Raum '+room+' erstellt — warte auf Mitspieler');
}

function joinRoom(){
  const room=getRoom();if(!room)return;
  wsRoom=room;wsIsHost=false;myName=getName();
  setStatus('wait','Verbinde mit Raum '+room+'…');
  lastMsgId='';
  startPolling();
  // Send join message
  setTimeout(()=>{
    sendMsg({type:'join',name:myName,bet:myBet});
    setStatus('wait','Verbunden — warte auf Host…');
  },500);
}

// ════════════════════════════════
// GAME LOGIC
// ════════════════════════════════
const FACES=["","⚀","⚁","⚂","⚃","⚄","⚅"];
const CATS=[
  {id:"u1",label:"Einser",upper:true,num:1},{id:"u2",label:"Zweier",upper:true,num:2},
  {id:"u3",label:"Dreier",upper:true,num:3},{id:"u4",label:"Vierer",upper:true,num:4},
  {id:"u5",label:"Fünfer",upper:true,num:5},{id:"u6",label:"Sechser",upper:true,num:6},
  {id:"l3p",label:"Dreierpasch",upper:false},{id:"l2pa",label:"Zwei Paare",upper:false},
  {id:"l4p",label:"Viererpasch",upper:false},{id:"l3pa",label:"Drei Paare",upper:false,fixed:35},
  {id:"lfh",label:"Full House",upper:false,fixed:25},{id:"l2dr",label:"Zwei Dreier",upper:false,fixed:45},
  {id:"lks",label:"Kl. Straße",upper:false,fixed:30},{id:"lgfh",label:"Gr. Full House",upper:false,fixed:45},
  {id:"lgs",label:"Gr. Straße",upper:false,fixed:40},{id:"lknf",label:"Kniffel",upper:false,fixed:50},
  {id:"l10",label:"10 od. weniger",upper:false,fixed:40},{id:"lhw",label:"Highway",upper:false,fixed:50},
  {id:"l33",label:"33 od. mehr",upper:false,fixed:40},{id:"lke",label:"Kniffel Extreme★",upper:false,fixed:75},
  {id:"lch",label:"Chance",upper:false},{id:"lsc",label:"Super Chance×2",upper:false},
];
const PRIO={lke:100,lknf:90,lhw:85,lgs:75,lgfh:70,l2dr:65,lks:60,lfh:55,l3pa:50,l4p:45,l33:40,l10:38,l3p:30,l2pa:25,u6:35,u5:32,u4:28,u3:24,u2:18,u1:14,lsc:10,lch:8};
const r6=()=>Math.ceil(Math.random()*6);
const r10=()=>Math.floor(Math.random()*10);
const allD=d=>[...d.w,d.r];
const dsum=d=>allD(d).reduce((a,b)=>a+b,0);

function calcSc(id,d){
  const a=allD(d),s=a.reduce((x,y)=>x+y,0);
  const cnt={};a.forEach(v=>{cnt[v]=(cnt[v]||0)+1});
  const vs=Object.values(cnt).sort((a,b)=>b-a);
  const u=[...new Set(a)].sort((a,b)=>a-b);
  const run=()=>{let c=1,b=1;for(let i=1;i<u.length;i++){if(u[i]===u[i-1]+1){c++;b=Math.max(b,c);}else if(u[i]!==u[i-1])c=1;}return b;};
  switch(id){
    case"u1":return a.filter(v=>v===1).length;case"u2":return a.filter(v=>v===2).length*2;
    case"u3":return a.filter(v=>v===3).length*3;case"u4":return a.filter(v=>v===4).length*4;
    case"u5":return a.filter(v=>v===5).length*5;case"u6":return a.filter(v=>v===6).length*6;
    case"l3p":return vs[0]>=3?s:0;case"l2pa":return vs.filter(v=>v>=2).length>=2?s:0;
    case"l4p":return vs[0]>=4?s:0;case"l3pa":return vs.filter(v=>v>=2).length>=3?35:0;
    case"lfh":return(vs[0]>=3&&vs.length>=2&&vs[1]>=2)?25:0;
    case"l2dr":return vs.filter(v=>v>=3).length>=2?45:0;case"lks":return run()>=4?30:0;
    case"lgfh":return(vs[0]>=4&&vs.length>=2&&vs[1]>=2)?45:0;case"lgs":return run()>=5?40:0;
    case"lknf":return vs[0]>=5?50:0;case"l10":return s<=10?40:0;case"lhw":return run()>=6?50:0;
    case"l33":return s>=33?40:0;case"lke":return vs[0]>=6?75:0;case"lch":return s;case"lsc":return s*2;

const isKnf=d=>{const c={};allD(d).forEach(v=>{c[v]=(c[v]||0)+1});return Object.values(c).sort((a,b)=>b-a)[0]>=5};
const isKE=d=>{const c={};allD(d).forEach(v=>{c[v]=(c[v]||0)+1});return Object.values(c).sort((a,b)=>b-a)[0]>=6};
const upSum=s=>["u1","u2","u3","u4","u5","u6"].reduce((t,id)=>t+(s[id]??0),0);
const totPts=s=>{const u=upSum(s);return u+(u>=73?45:0)+CATS.filter(c=>!c.upper).reduce((t,c)=>t+(s[c.id]??0),0);};

function ktFor(id,d){
  const a=allD(d);const cnt={};a.forEach(v=>{cnt[v]=(cnt[v]||0)+1});
  const by=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);const top=parseInt(by[0][0]);
  switch(id){
    case"u1":case"u2":case"u3":case"u4":case"u5":case"u6":{const n=CATS.find(c=>c.id===id).num;return{w:d.w.map(v=>v===n),r:d.r===n};}
    case"lke":case"lknf":return{w:d.w.map(v=>v===top),r:d.r===top};
    case"lhw":case"lgs":case"lks":{const u=[...new Set(a)].sort((a,b)=>a-b);let best=[],cur=[u[0]];for(let i=1;i<u.length;i++){if(u[i]===u[i-1]+1)cur.push(u[i]);else{if(cur.length>best.length)best=cur;cur=[u[i]];}}if(cur.length>best.length)best=cur;const ss=new Set(best);const used=new Set();return{w:d.w.map(v=>{if(ss.has(v)&&!used.has(v)){used.add(v);return true;}return false;}),r:(ss.has(d.r)&&!used.has(d.r))?(()=>{used.add(d.r);return true;})():false};}
    case"lgfh":case"lfh":{const tri=by.find(([,c])=>c>=3);if(tri){const tv=parseInt(tri[0]);const pair=by.find(([v,c])=>parseInt(v)!==tv&&c>=2);if(pair){const pv=parseInt(pair[0]);return{w:d.w.map(v=>v===tv||v===pv),r:d.r===tv||d.r===pv};}return{w:d.w.map(v=>v===tv),r:d.r===tv};}const p=by.filter(([,c])=>c>=2).map(([v])=>parseInt(v)).slice(0,2);const ps=new Set(p);return{w:d.w.map(v=>ps.has(v)),r:ps.has(d.r)};}
    case"l2dr":{const t=by.filter(([,c])=>c>=2).map(([v])=>parseInt(v)).slice(0,2);const ts=new Set(t);return{w:d.w.map(v=>ts.has(v)),r:ts.has(d.r)};}
    case"l3pa":{const p=by.filter(([,c])=>c>=2).map(([v])=>parseInt(v)).slice(0,3);const ps=new Set(p);return{w:d.w.map(v=>ps.has(v)),r:ps.has(d.r)};}
    case"l4p":case"l3p":case"l2pa":{if(by[0][1]>=3)return{w:d.w.map(v=>v===top),r:d.r===top};const p=by.filter(([,c])=>c>=2).map(([v])=>parseInt(v)).slice(0,2);if(p.length>=2){const ps=new Set(p);return{w:d.w.map(v=>ps.has(v)),r:ps.has(d.r)};}return{w:d.w.map(v=>v===top),r:d.r===top};}
    case"l33":return{w:d.w.map(v=>v>=5),r:d.r>=5};case"l10":return{w:d.w.map(v=>v<=2),r:d.r<=1};
    default:return{w:d.w.map(v=>v>=5),r:d.r>=7};
  }
}
function sampleEV(catId,d,keep,rerolls,N=80){
  if(rerolls===0)return calcSc(catId,d);let t=0;
  for(let i=0;i<N;i++){const d2={w:d.w.map((v,j)=>keep.w[j]?v:r6()),r:keep.r?d.r:r10()};if(rerolls>=2){const k2=ktFor(catId,d2);const d3={w:d2.w.map((v,j)=>k2.w[j]?v:r6()),r:k2.r?d2.r:r10()};t+=calcSc(catId,d3);}else t+=calcSc(catId,d2);}
  return t/N;
}
function botPick(d,scores,rerolls){
  const free=CATS.filter(c=>scores[c.id]===undefined);if(!free.length)return null;
  const up=upSum(scores);const upF=CATS.filter(c=>c.upper&&scores[c.id]===undefined).length;const urg=up<73&&upF<=3;
  let bc=null,bk=null,bv=-Infinity;
  for(const cat of free){
    const keep=ktFor(cat.id,d);const e=sampleEV(cat.id,d,keep,rerolls,80);const pri=PRIO[cat.id]??20;
    let val=e<=0?-pri*2:e*(pri/30);
    if(cat.upper&&urg&&calcSc(cat.id,d)>=Math.ceil((73-up)/Math.max(upF,1))*0.7)val+=15;
    if(cat.id==="lke")val=e>5?e*3:e*0.1;if(cat.id==="lknf")val=e>5?e*2.2:e*0.15;
    if(cat.id==="lhw")val=e>5?e*2:e*0.1;if(cat.id==="l2dr")val=e>5?e*1.6:e*0.3;
    if(cat.id==="lgfh")val=e>5?e*1.3:e*0.4;if(cat.id==="lsc")val=e*1.15;
    if(val>bv){bv=val;bc=cat.id;bk=keep;}
  }
  return{cat:bc,keep:bk};
}
function botScratch(scores){return CATS.filter(c=>scores[c.id]===undefined).sort((a,b)=>(PRIO[a.id]??20)-(PRIO[b.id]??20))[0]?.id;}

let G={};

function vsBot(){

function startGame(players,bet,iAmHost){
  gameMode=players.some(p=>p.isBot)?'bot':'multi';
  G={
    players,myIdx:iAmHost?0:1,bet:bet||0,

  const s=dsum(G.dice),ks=G.dice.w.reduce((t,v,i)=>t+(G.kept.w[i]?v:0),0)+(G.kept.r?G.dice.r:0),kc=G.kept.w.filter(Boolean).length+(G.kept.r?1:0);

let rollTimer=null;
function animateAndRoll(keptSnap,callback){
  G.rolling=true;render();let f=0;
  rollTimer=setInterval(()=>{
    f++;
    G.dice.w.forEach((v,i)=>{if(!keptSnap.w[i]){const el=document.getElementById('dw'+i);if(el){const rv=r6();el.querySelector('.face').textContent=rv>=1&&rv<=6?FACES[rv]:String(rv);}}});
    if(!keptSnap.r){const el=document.getElementById('dr');if(el)el.querySelector('.face').textContent=String(r10());}
    if(f>=14){clearInterval(rollTimer);rollTimer=null;G.rolling=false;callback();}
  },35);

function tw(i){if(G.phase!=='rolling'||!myTurn())return;G.kept.w[i]=!G.kept.w[i];render();}
function tr_(){if(G.phase!=='rolling'||!myTurn())return;G.kept.r=!G.kept.r;render();}
function toggleStrike(){G.strikeMode=!G.strikeMode;G.confirmRestart=false;render();}
function askRestart(){G.confirmRestart=true;render();}
function cancelRestart(){G.confirmRestart=false;render();}
function goLobby(){stopPolling();switchScreen('L');}

function doRoll(){
  if(!G.rolls||!myTurn()||G.rolling)return;
  G.confirmRestart=false;
  if(G.phase==='idle'){
    G.kept=nk();G.msg='Würfeln…';
    animateAndRoll(nk(),()=>{G.dice=nd();G.rolls=2;G.phase='rolling';G.msg=`${G.rolls} Würfe übrig — antippen zum Halten.`;render();});
  } else if(G.phase==='rolling'){
    const snap={w:[...G.kept.w],r:G.kept.r};G.msg='Würfeln…';
    animateAndRoll(snap,()=>{G.dice={w:G.dice.w.map((v,i)=>snap.w[i]?v:r6()),r:snap.r?G.dice.r:r10()};G.rolls--;if(G.rolls===0){G.phase='score';G.msg='Kein Wurf mehr — Feld auswählen!';}else G.msg=`${G.rolls} Wurf übrig.`;render();});
  }
}
function forceScore(){G.phase='score';G.rolls=0;G.msg='Feld antippen zum Eintragen.';render();}
function useChip(){if(!G.chips||G.phase!=='score'||!myTurn())return;G.chips--;G.rolls=1;G.phase='rolling';G.strikeMode=false;G.msg=`Chip eingesetzt! (${G.chips} übrig)`;render();}

function act(id,strike){
  if(G.scores[G.myIdx][id]!==undefined||!myTurn())return;
  const val=strike?0:calcSc(id,G.dice);
  G.scores[G.myIdx][id]=val;G.strikeMode=false;G.confirmRestart=false;
  if((id==='lknf'||id==='lke')&&val>0)G.counts[G.myIdx][id]=1;
  if(gameMode==='multi')sendMsg({type:'move',id,val,count:G.counts[G.myIdx][id]||0});
  advance();
}
function actKnf(id){
  if(G.scores[G.myIdx][id]===undefined||!myTurn()||calcSc(id,G.dice)===0)return;
  const base=CATS.find(c=>c.id===id).fixed,nc=(G.counts[G.myIdx][id]||1)+1;
  G.counts[G.myIdx][id]=nc;G.scores[G.myIdx][id]=base*nc;
  G.confirmRestart=false;G.strikeMode=true;
  G.msg=`${nc}× ${CATS.find(c=>c.id===id).label} = ${G.scores[G.myIdx][id]} Pkt! Jetzt streichen.`;
  if(gameMode==='multi')sendMsg({type:'move',id,val:G.scores[G.myIdx][id],count:nc});
  render();
}
function applyMove(data){
  const oi=G.players.findIndex((_,i)=>i!==G.myIdx);if(oi<0)return;
  G.scores[oi][data.id]=data.val;if(data.count>0)G.counts[oi][data.id]=data.count;
  if(G.curP!==G.myIdx){if(checkDone())return;G.curP=G.myIdx;G.phase='idle';G.rolls=3;G.dice=nd();G.kept=nk();G.msg='Dein Zug!';showToast('Gegner hat gespielt!');}
  render();
}
function advance(){
  if(checkDone())return;
  G.curP=(G.curP+1)%G.players.length;G.phase='idle';G.rolls=3;G.dice=nd();G.kept=nk();
  G.msg=G.players[G.curP]?.isBot?'Bot ist dran…':'Warte auf Gegner…';render();
  if(G.players[G.curP]?.isBot){G.phase='bot';render();setTimeout(botTurn,700);}
}
function checkDone(){if(G.scores.every(s=>CATS.every(c=>s[c.id]!==undefined))){G.phase='gameover';render();return true;}return false;}
function botTurn(){
  const bi=G.players.findIndex(p=>p.isBot);if(bi<0)return;const bsc=G.scores[bi];
  let d=nd();let dec=botPick(d,bsc,2);if(dec?.keep)d={w:d.w.map((v,i)=>dec.keep.w[i]?v:r6()),r:dec.keep.r?d.r:r10()};
  dec=botPick(d,bsc,1);if(dec?.keep)d={w:d.w.map((v,i)=>dec.keep.w[i]?v:r6()),r:dec.keep.r?d.r:r10()};
  dec=botPick(d,bsc,0);let chosen=dec?.cat;
  const ki=isKE(d)?'lke':isKnf(d)?'lknf':null;
  if(ki&&bsc[ki]!==undefined){const base=CATS.find(c=>c.id===ki).fixed;const nc=(G.counts[bi][ki]||1)+1;G.counts[bi][ki]=nc;bsc[ki]=base*nc;const s=botScratch(bsc);if(s)bsc[s]=0;G.msg=`Bot: ${nc}× ${CATS.find(c=>c.id===ki)?.label} = ${bsc[ki]} Pkt!`;}
  else{if(!chosen)chosen=botScratch(bsc);if(chosen){bsc[chosen]=calcSc(chosen,d)===0?0:calcSc(chosen,d);if((chosen==='lknf'||chosen==='lke')&&bsc[chosen]>0)G.counts[bi][chosen]=1;G.msg=`Bot: ${bsc[chosen]} Pkt in "${CATS.find(c=>c.id===chosen)?.label}".`;}}
  if(checkDone())return;G.curP=G.myIdx;G.phase='idle';G.rolls=3;G.dice=nd();G.kept=nk();render();
}

function switchScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
let toastT;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);}
document.getElementById('nameIn').value='Spieler'+(Math.floor(Math.random()*99)+1);
</script>
