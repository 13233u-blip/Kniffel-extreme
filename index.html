<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kniffel Extreme</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
:root{
  --bg:#e8f0ff;--sf:#fff;--s2:#dce8ff;--bd:#b0c8f0;
  --blue:#1a4acc;--accent:#0033bb;--green:#1a9e5a;--red:#cc3300;
  --gold:#e8a800;--text:#0a1a3a;--mu:#4a6090;--dim:#99b0d0;
  --r:16px;--rs:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif;}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
.screen{display:none;flex-direction:column;height:100%;}
.screen.active{display:flex;}

/* LOBBY */
#L{align-items:center;overflow-y:auto;padding:24px 16px 48px;gap:16px;background:linear-gradient(160deg,#e0ecff 0%,#c8dcff 100%);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:62px;letter-spacing:5px;color:var(--accent);line-height:1;text-align:center;text-shadow:2px 3px 0 rgba(0,0,120,.15);}
.logo-s{font-size:11px;letter-spacing:5px;color:var(--mu);text-transform:uppercase;text-align:center;margin-top:2px;}
.lcard{background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--r);padding:18px;width:100%;max-width:390px;display:flex;flex-direction:column;gap:11px;box-shadow:0 2px 10px rgba(0,50,180,.08);}
.lbl{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--mu);}
.inp{background:var(--s2);border:1.5px solid var(--bd);border-radius:var(--rs);padding:13px 16px;color:var(--text);font-size:16px;font-family:'Nunito',sans-serif;font-weight:700;width:100%;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--accent);}
.bet-g{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.bo{padding:10px 4px;border-radius:var(--rs);border:1.5px solid var(--bd);background:var(--s2);color:var(--mu);font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;font-family:'Nunito',sans-serif;}
.bo.sel{border-color:var(--gold);background:#fffbe0;color:#8a6000;}
.divider{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;font-weight:700;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bd);}
.player-list{display:flex;flex-direction:column;gap:7px;}
.player-item{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:10px;padding:10px 13px;font-size:13px;font-weight:700;border:1px solid var(--bd);}
.pdot{width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0;}
.phost{font-size:10px;color:#8a6000;margin-left:auto;font-weight:800;}
.dp span{animation:dp 1.2s infinite;}.dp span:nth-child(2){animation-delay:.2s;}.dp span:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{opacity:.15}40%{opacity:1}}

/* BUTTONS */
.btn{padding:13px 20px;border-radius:var(--rs);font-size:14px;font-weight:700;font-family:'Nunito',sans-serif;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{transform:scale(.95);}
.btn:disabled{opacity:.35;transform:none;cursor:default;}
.btn-p{background:linear-gradient(135deg,#1a4acc,#2255ee);color:#fff;width:100%;font-size:15px;padding:15px;box-shadow:0 4px 16px rgba(26,74,204,.3);}
.btn-b{background:var(--s2);border:1.5px solid var(--accent);color:var(--accent);width:100%;}
.btn-g{background:linear-gradient(135deg,#e8a800,#f5c800);color:#5a3a00;width:100%;font-size:15px;padding:15px;font-weight:800;}
.btn-gh{background:var(--s2);border:1.5px solid var(--bd);color:var(--mu);}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:10px;}

/* GAME */
#G{flex-direction:column;}
.ghdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 8px;border-bottom:2px solid #1033aa;background:linear-gradient(135deg,#1a4acc,#0033bb);flex-shrink:0;}
.glogo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#fff;}
.hr{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;}
.chip{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.6);}
.chip.u{background:rgba(255,255,255,.25);box-shadow:none;}
.sp{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.sp-y{background:rgba(255,255,255,.95);color:var(--accent);}
.sp-o{background:rgba(255,240,150,.95);color:#5a3a00;}
.sp-b{background:rgba(255,255,255,.2);color:#fff;font-size:10px;}
.scroll{flex:1;overflow-y:auto;padding:12px 12px 110px;display:flex;flex-direction:column;gap:12px;}
.card{background:var(--sf);border:1.5px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:0 2px 8px rgba(0,50,180,.07);}
.tbadge{display:inline-block;font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;margin-bottom:10px;letter-spacing:.5px;}
.tb-y{background:#e0e8ff;color:var(--accent);border:1px solid #b0c0f0;}
.tb-o{background:#e0fff0;color:var(--green);border:1px solid #a0d8b0;}
.tb-b{background:var(--s2);color:var(--mu);border:1px solid var(--bd);}
.stxt{font-size:13px;color:var(--mu);min-height:18px;margin-bottom:10px;line-height:1.5;font-weight:600;}

/* ══ CSS DOT DICE ══ */
.dice-scene{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}

/* The die container */
.die-wrap{
  width:68px;height:68px;
  border-radius:13px;
  border:2.5px solid #3a3a3a;
  background:#fff;
  display:grid;
  grid-template-areas:
    "a . b"
    "c e d"
    "f . g";
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:1fr 1fr 1fr;
  padding:8px;
  gap:0;
  cursor:pointer;
  user-select:none;
  position:relative;
  transition:all .18s;
  box-shadow:0 3px 8px rgba(0,0,0,.15);
}
.die-wrap:active{transform:scale(.88);}

/* Kept = blue border */
.die-wrap.kept{border-color:var(--accent);background:#dce8ff;box-shadow:0 0 14px rgba(26,74,204,.4);}
.die-wrap.kept::after{content:'✓';position:absolute;top:2px;right:5px;font-size:10px;font-weight:800;color:var(--accent);}

/* Red W10 die */
.die-wrap.rdie{border-color:#cc3300;background:#fff;}
.die-wrap.rdie.kept{border-color:#cc3300;background:#ffe8e0;box-shadow:0 0 14px rgba(204,51,0,.35);}

/* Dots — dark filled circles */
.dot{
  width:10px;height:10px;
  border-radius:50%;
  background:#333;
  align-self:center;
  justify-self:center;
}
.die-wrap.rdie .dot{background:#cc2200;}
.die-wrap.kept .dot{background:#0033bb;}
.die-wrap.rdie.kept .dot{background:#cc2200;}

/* Dot positions */
.dot-a{grid-area:a;}
.dot-b{grid-area:b;}
.dot-c{grid-area:c;}
.dot-d{grid-area:d;}
.dot-e{grid-area:e;}
.dot-f{grid-area:f;}
.dot-g{grid-area:g;}

/* Number display for W10 (0-9, no dots for 7-9) */
.die-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0;
  color:#cc2200;pointer-events:none;
}
.die-lbl{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  font-size:7px;font-weight:800;letter-spacing:1px;color:#cc2200;text-transform:uppercase;
}

/* Roll animation */
@keyframes dieRoll{
  0%  {transform:scale(1.25) rotate(-15deg);}
  20% {transform:scale(.82)  rotate(12deg);}
  40% {transform:scale(1.12) rotate(-8deg);}
  60% {transform:scale(.92)  rotate(5deg);}
  80% {transform:scale(1.05) rotate(-2deg);}
  100%{transform:scale(1)    rotate(0deg);}
}
.die-wrap.rolling{animation:dieRoll .45s cubic-bezier(.36,.07,.19,.97);}

/* Opponent dice preview */
.opp-section{margin:8px 0 4px;}
.opp-label{font-size:11px;color:var(--mu);font-weight:700;margin-bottom:6px;}
.opp-dice{display:flex;gap:8px;flex-wrap:wrap;}
.opp-die{
  width:42px;height:42px;border-radius:9px;border:2px solid #3a3a3a;
  background:#fff;display:grid;
  grid-template-areas:"a . b""c e d""f . g";
  grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;
  padding:5px;box-shadow:0 2px 4px rgba(0,0,0,.1);
}
.opp-die.opp-rd{border-color:#cc3300;}
.opp-die .dot{width:7px;height:7px;background:#333;border-radius:50%;align-self:center;justify-self:center;}
.opp-die.opp-rd .dot{background:#cc2200;}
.opp-die .die-num{font-size:18px;}

/* Sum bar */
.sbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.snum{font-family:'Bebas Neue',sans-serif;font-size:28px;background:var(--s2);padding:2px 16px;border-radius:20px;border:1.5px solid var(--bd);color:var(--text);letter-spacing:1px;}
.ht{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;}
.ht-g{background:#e0fff0;color:var(--green);border:1px solid #a0d8b0;}
.ht-b{background:#e0e8ff;color:var(--accent);border:1px solid #b0c0f0;}

/* Quick btns */
.qrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
.qbtn{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;border:1.5px solid var(--accent);background:#e0e8ff;color:var(--accent);cursor:pointer;font-family:'Nunito',sans-serif;transition:all .15s;}
.qbtn:active{transform:scale(.93);}
.qbtn.knf{border-color:var(--red);background:#fff0ee;color:var(--red);}

/* Action row */
.arow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.btn-roll{background:linear-gradient(135deg,#1a4acc,#2255ee);color:#fff;font-size:16px;font-weight:800;padding:14px 22px;box-shadow:0 4px 16px rgba(26,74,204,.35);border-radius:var(--rs);}
.btn-roll:disabled{background:var(--s2);box-shadow:none;color:var(--mu);}
.btn-chip{background:#fff0ee;border:1.5px solid #cc3300;color:#cc3300;padding:11px 16px;border-radius:var(--rs);}
.btn-wert{background:var(--s2);border:1.5px solid var(--bd);color:var(--text);padding:11px 16px;border-radius:var(--rs);}
.btn-stk{background:var(--s2);border:1.5px solid var(--bd);color:var(--mu);padding:11px 16px;border-radius:var(--rs);}
.btn-stk.on{background:#fff0ee;border-color:#cc3300;color:#cc3300;}
.btn-new{background:var(--s2);border:1.5px solid var(--bd);color:var(--mu);font-size:12px;padding:9px 13px;border-radius:var(--rs);}
.ban{border-radius:var(--rs);padding:10px 14px;font-size:12px;font-weight:600;margin:8px 0;line-height:1.5;}
.ban-s{background:#fff0ee;border:1px solid #f0b8a8;color:#993010;}
.ban-cf{background:#fff0ee;border:1px solid #f0b8a8;color:#993010;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;}

/* Score table */
.shdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.shdr-t{font-size:14px;font-weight:800;}
.shdr-n{font-size:10px;color:var(--mu);font-weight:700;}
.slbl{font-size:9px;font-weight:800;letter-spacing:2.5px;color:var(--mu);text-transform:uppercase;padding:7px 4px 4px;border-bottom:1px solid var(--bd);}
.sr{display:flex;align-items:center;padding:7px 4px;border-bottom:1px solid rgba(150,180,230,.3);border-radius:8px;cursor:default;transition:background .12s;}
.sr.can{cursor:pointer;}.sr.can:active{background:#e0e8ff;}
.sr.stk{cursor:pointer;}.sr.stk:active{background:#fff0ee;}
.cn{flex:1;font-size:12px;font-weight:600;}.cfx{font-size:9px;color:var(--mu);margin-left:3px;}
.cv{min-width:44px;text-align:right;font-size:12px;font-weight:700;}
.cv.prev{color:var(--accent);font-style:italic;}.cv.scrd{color:var(--text);}.cv.zero{color:var(--dim);}.cv.spv{color:#cc3300;font-style:italic;}.cv.emp{color:var(--dim);}
.kb{display:inline-block;font-size:9px;font-weight:800;background:var(--gold);color:#5a3a00;padding:1px 5px;border-radius:6px;margin-left:3px;}
.bonrow{padding:5px 4px;font-size:11px;color:var(--mu);font-weight:600;display:flex;align-items:center;border-bottom:1px solid var(--bd);}
.totrow{padding:9px 4px;display:flex;align-items:center;font-weight:800;font-size:15px;}

/* Gameover */
.gow{text-align:center;padding:32px 16px;}
.got{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;color:var(--accent);margin-bottom:6px;}
.gos{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;margin-bottom:28px;}
.gob .gn{font-size:11px;color:var(--mu);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.gob .gp{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:2px;}
.gob.win .gp{color:var(--accent);}
.betres{font-size:15px;font-weight:800;color:var(--green);margin-bottom:20px;}
.think{text-align:center;padding:20px;color:var(--mu);font-size:14px;font-weight:600;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:#0033bb;border-radius:14px;padding:11px 20px;font-size:13px;font-weight:700;color:#fff;z-index:200;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 6px 24px rgba(0,50,180,.3);}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="screen active" id="L">
  <div class="logo">Kniffel<br>Extreme</div>
  <div class="logo-s">Multiplayer Edition</div>
  <div class="lcard">
    <div class="lbl">Dein Name</div>
    <input class="inp" id="nameIn" maxlength="14" placeholder="Spielername">
  </div>
  <div class="lcard">
    <div class="lbl">Einsatz 💰</div>
    <div class="bet-g">
      <div class="bo sel" data-v="0"  onclick="setBet(0)">Kein</div>
      <div class="bo"    data-v="5"   onclick="setBet(5)">5 €</div>
      <div class="bo"    data-v="10"  onclick="setBet(10)">10 €</div>
      <div class="bo"    data-v="20"  onclick="setBet(20)">20 €</div>
      <div class="bo"    data-v="50"  onclick="setBet(50)">50 €</div>
      <div class="bo"    data-v="100" onclick="setBet(100)">100 €</div>
    </div>
    <input class="inp" id="betCustom" type="number" min="0" placeholder="Eigener Betrag (€)" style="margin-top:4px;" oninput="setBet(parseInt(this.value)||0,true)">
  </div>
  <div class="lcard">
    <div class="lbl">Spielmodus</div>
    <button class="btn btn-p" onclick="vsBot()">🤖 Gegen Bot spielen</button>
    <div class="divider">oder Multiplayer (bis 5 Spieler)</div>
    <input class="inp" id="roomIn" placeholder="4-stelliger Code" maxlength="4"
      style="text-transform:uppercase;letter-spacing:5px;font-weight:800;font-size:26px;text-align:center;"
      oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
    <div style="display:flex;gap:8px;">
      <button class="btn btn-p" style="flex:1" onclick="createRoom()">🏠 Erstellen</button>
      <button class="btn btn-b" style="flex:1;width:auto;" onclick="joinRoom()">🚪 Beitreten</button>
    </div>
  </div>
  <div class="lcard" id="waitCard" style="display:none;">
    <div class="lbl">Raum <span id="waitCode" style="color:#8a6000;letter-spacing:4px;font-size:16px;"></span></div>
    <div class="player-list" id="playerList"></div>
    <div style="font-size:11px;color:var(--mu);font-weight:600;line-height:1.6;">Teile den Code — gleicher Link, gleicher Code, dann Beitreten.</div>
    <button class="btn btn-g" id="startBtn" onclick="hostStart()" style="display:none;">🎲 Spiel starten!</button>
    <div id="guestWait" style="font-size:13px;color:var(--mu);font-weight:600;text-align:center;display:none;">Warte auf Host <span class="dp"><span>.</span><span>.</span><span>.</span></span></div>
  </div>
</div>

<div class="screen" id="G">
  <div class="ghdr">
    <div class="glogo">KNIFFEL EXTREME</div>
    <div class="hr">
      <div id="chipRow" style="display:flex;gap:4px;"></div>
      <div id="betBadge"></div>
      <div id="scorePills" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
    </div>
  </div>
  <div class="scroll" id="SA"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const ABLY_KEY='M2eomA.5AAhxQ:964xp-NgIAkMlTCX5gxoIoFVR8HAB5qfZQY30Ev_qck';

// ── CSS Dot Dice renderer ─────────────────────────────────────────
// Returns inner HTML of dots for a given value (1-6 for white, 0-9 for red)
const DOT_LAYOUTS = {
  1: ['','','','','e','',''],
  2: ['a','','','','','','g'],
  3: ['a','','','','e','','g'],
  4: ['a','b','','','','f','g'],
  5: ['a','b','','','e','f','g'],
  6: ['a','b','c','d','','f','g'],
};
// dot positions: a=TL, b=TR, c=ML, d=MR, e=C, f=BL, g=BR

function dotDiceHTML(val, isRed){
  const layout = DOT_LAYOUTS[val];
  if(layout){
    const pos=['a','b','c','d','e','f','g'];
    return pos.map(p=>layout.includes(p)?`<div class="dot dot-${p}"></div>`:`<div class="dot-${p}"></div>`).join('');
  }
  // For values outside 1-6 (W10: 0,7,8,9) — show number
  return `<div class="die-num">${val}</div>`;
}

function makeDie(val, cls, id, onclick, isRed, showLbl){
  const inner = dotDiceHTML(val, isRed);
  const lbl = showLbl ? `<div class="die-lbl">W10</div>` : '';
  return `<div class="die-wrap${cls}" id="${id}" onclick="${onclick}">${inner}${lbl}</div>`;
}

function makeOppDie(val, isRed){
  const inner = dotDiceHTML(val, isRed);
  return `<div class="opp-die${isRed?' opp-rd':''}">${inner}</div>`;
}

const CATS=[
  {id:"u1",label:"Einser",upper:true,num:1},{id:"u2",label:"Zweier",upper:true,num:2},
  {id:"u3",label:"Dreier",upper:true,num:3},{id:"u4",label:"Vierer",upper:true,num:4},
  {id:"u5",label:"Fünfer",upper:true,num:5},{id:"u6",label:"Sechser",upper:true,num:6},
  {id:"l3p",label:"Dreierpasch",upper:false},{id:"l2pa",label:"Zwei Paare",upper:false},
  {id:"l4p",label:"Viererpasch",upper:false},{id:"l3pa",label:"Drei Paare",upper:false,fixed:35},
  {id:"lfh",label:"Full House",upper:false,fixed:25},{id:"l2dr",label:"Zwei Dreier",upper:false,fixed:45},
  {id:"lks",label:"Kl. Straße",upper:false,fixed:30},{id:"lgfh",label:"Gr. Full House",upper:false,fixed:45},
  {id:"lgs",label:"Gr. Straße",upper:false,fixed:40},{id:"lknf",label:"Kniffel",upper:false,fixed:50},
  {id:"l10",label:"10 od. weniger",upper:false,fixed:40},{id:"lhw",label:"Highway",upper:false,fixed:50},
  {id:"l33",label:"33 od. mehr",upper:false,fixed:40},{id:"lke",label:"Kniffel Extreme★",upper:false,fixed:75},
  {id:"lch",label:"Chance",upper:false},{id:"lsc",label:"Super Chance×2",upper:false},
];
const PRIO={lke:100,lknf:90,lhw:85,lgs:75,lgfh:70,l2dr:65,lks:60,lfh:55,l3pa:50,l4p:45,l33:40,l10:38,l3p:30,l2pa:25,u6:35,u5:32,u4:28,u3:24,u2:18,u1:14,lsc:10,lch:8};
const r6=()=>Math.ceil(Math.random()*6);
const r10=()=>Math.floor(Math.random()*10);
const allD=d=>[...d.w,d.r];
const dsum=d=>allD(d).reduce((a,b)=>a+b,0);

function calcSc(id,d){
  const a=allD(d),s=a.reduce((x,y)=>x+y,0);
  const cnt={};a.forEach(v=>{cnt[v]=(cnt[v]||0)+1});
  const vs=Object.values(cnt).sort((a,b)=>b-a);
  const u=[...new Set(a)].sort((a,b)=>a-b);
  const run=()=>{let c=1,b=1;for(let i=1;i<u.length;i++){if(u[i]===u[i-1]+1){c++;b=Math.max(b,c);}else if(u[i]!==u[i-1])c=1;}return b;};
  switch(id){

const isKnf=d=>{const c={};allD(d).forEach(v=>{c[v]=(c[v]||0)+1});return Object.values(c).sort((a,b)=>b-a)[0]>=5};

function ktFor(id,d){
  const a=allD(d);const cnt={};a.forEach(v=>{cnt[v]=(cnt[v]||0)+1});

    case"lgfh":case"lfh":{const tri=by.find(([,c])=>c>=3);if(tri){const tv=parseInt(tri[0]);const pair=by.find(([v,c])=>parseInt(v)!==tv&&c>=2);if(pair){const pv=parseInt(pair[0]);return{w:d.w.map(v=>v===tv||v===pv),r:d.r===tv||d.r===pv};}return{w:d.w.map(v=>v===tv),r:d.r===tv};}const p=by.filter(([,c])=>c>=2).map(([v])=>parseInt(v)).slice(0,2);const ps=new Set(p);return{w:d.w.map(v=>ps.has(v)),r:ps.has(d.r)};}
    case"l2dr":{const t=by.filter(([,c])=>c>=2).map(([v])=>parseInt(v)).slice(0,2);const ts=new Set(t);return{w:d.w.map(v=>ts.has(v)),r:ts.has(d.r)};}
    case"l3pa":{const p=by.filter(([,c])=>c>=2).map(([v])=>parseInt(v)).slice(0,3);const ps=new Set(p);return{w:d.w.map(v=>ps.has(v)),r:ps.has(d.r)};}
    default:{if(by[0][1]>=3)return{w:d.w.map(v=>v===top),r:d.r===top};const p=by.filter(([,c])=>c>=2).map(([v])=>parseInt(v)).slice(0,2);if(p.length>=2){const ps=new Set(p);return{w:d.w.map(v=>ps.has(v)),r:ps.has(d.r)};}return{w:d.w.map(v=>v===top),r:d.r===top};}

function botPick(d,scores,rerolls){
  const free=CATS.filter(c=>scores[c.id]===undefined);if(!free.length)return null;
  const up=upSum(scores);const upF=CATS.filter(c=>c.upper&&scores[c.id]===undefined).length;const urg=up<73&&upF<=3;
  let bc=null,bk=null,bv=-Infinity;
  for(const cat of free){const keep=ktFor(cat.id,d);const e=sampleEV(cat.id,d,keep,rerolls,60);const pri=PRIO[cat.id]??20;let val=e<=0?-pri*2:e*(pri/30);if(cat.upper&&urg&&calcSc(cat.id,d)>=Math.ceil((73-up)/Math.max(upF,1))*0.7)val+=15;if(cat.id==="lke")val=e>5?e*3:e*0.1;if(cat.id==="lknf")val=e>5?e*2.2:e*0.15;if(cat.id==="lhw")val=e>5?e*2:e*0.1;if(cat.id==="l2dr")val=e>5?e*1.6:e*0.3;if(cat.id==="lgfh")val=e>5?e*1.3:e*0.4;if(cat.id==="lsc")val=e*1.15;if(val>bv){bv=val;bc=cat.id;bk=keep;}}

    if(!keptSnap.r){
      const nv=r10(); G.dice.r=nv;
      const el=document.getElementById('dr');
      if(el){
        const layout=DOT_LAYOUTS[nv];
        if(layout){const pos=['a','b','c','d','e','f','g'];el.innerHTML=pos.map(p=>layout.includes(p)?`<div class="dot dot-${p}"></div>`:`<div class="dot-${p}"></div>`).join('')+'<div class="die-lbl">W10</div>';}
        else el.innerHTML=`<div class="die-num">${nv}</div><div class="die-lbl">W10</div>`;
      }
    }
    // Broadcast live dice state every 3 frames
    if(f%3===0&&gameMode==='multi') ablyPub('dicestate',{dice:{w:[...G.dice.w],r:G.dice.r},kept:keptSnap,rolling:true});

    if(f>=14){
      clearInterval(rollTimer);rollTimer=null;G.rolling=false;
      // Broadcast final state (rolling=false so opponent sees final dice)
      if(gameMode==='multi') ablyPub('dicestate',{dice:{w:[...G.dice.w],r:G.dice.r},kept:keptSnap,rolling:false});
      callback();
    }
  },35);
}

function tw(i){if(G.phase!=='rolling'||!myTurn())return;G.kept.w[i]=!G.kept.w[i];render();if(gameMode==='multi')ablyPub('dicestate',{dice:G.dice,kept:G.kept,rolling:false});}
function tr_(){if(G.phase!=='rolling'||!myTurn())return;G.kept.r=!G.kept.r;render();if(gameMode==='multi')ablyPub('dicestate',{dice:G.dice,kept:G.kept,rolling:false});}
function toggleStrike(){G.strikeMode=!G.strikeMode;G.confirmRestart=false;render();}
function askRestart(){G.confirmRestart=true;render();}
function cancelRestart(){G.confirmRestart=false;render();}
function goLobby(){if(ably){ably.close();ably=null;channel=null;}document.getElementById('waitCard').style.display='none';switchScreen('L');}

function doRoll(){
  if(!G.rolls||!myTurn()||G.rolling)return;
  G.confirmRestart=false;
  if(G.phase==='idle'){
    G.kept=nk();
    animateRoll(nk(),()=>{G.rolls=2;G.phase='rolling';G.msg=`${G.rolls} Würfe übrig — antippen zum Halten.`;render();});
  } else if(G.phase==='rolling'){
    const snap={w:[...G.kept.w],r:G.kept.r};
    animateRoll(snap,()=>{G.rolls--;if(G.rolls===0){G.phase='score';G.msg='Kein Wurf mehr — Feld auswählen!';}else G.msg=`${G.rolls} Wurf übrig.`;render();});
  }
}
function forceScore(){G.phase='score';G.rolls=0;G.msg='Feld antippen.';render();}
function useChip(){if(!G.chips||G.phase!=='score'||!myTurn())return;G.chips--;G.rolls=1;G.phase='rolling';G.strikeMode=false;G.msg=`Chip! (${G.chips} übrig)`;render();}

function act(id,strike){
  if(G.scores[G.myIdx][id]!==undefined||!myTurn())return;
  const val=strike?0:calcSc(id,G.dice);
  G.scores[G.myIdx][id]=val;G.strikeMode=false;G.confirmRestart=false;
  if((id==='lknf'||id==='lke')&&val>0)G.counts[G.myIdx][id]=1;
  if(gameMode==='multi')ablyPub('move',{type:'score',id,val,count:G.counts[G.myIdx][id]||0});
  advance();
}
function actKnf(id){
  if(G.scores[G.myIdx][id]===undefined||!myTurn()||calcSc(id,G.dice)===0)return;
  const base=CATS.find(c=>c.id===id).fixed,nc=(G.counts[G.myIdx][id]||1)+1;
  G.counts[G.myIdx][id]=nc;G.scores[G.myIdx][id]=base*nc;G.confirmRestart=false;G.strikeMode=true;
  G.msg=`${nc}× ${CATS.find(c=>c.id===id).label} = ${G.scores[G.myIdx][id]} Pkt! Jetzt streichen.`;
  if(gameMode==='multi')ablyPub('move',{type:'score',id,val:G.scores[G.myIdx][id],count:nc});
  render();
}
function applyRemoteMove(d){
  if(d.type!=='score')return;
  const pIdx=G.players.findIndex(p=>p.id===d.from);if(pIdx<0||pIdx===G.myIdx)return;
  G.scores[pIdx][d.id]=d.val;if(d.count>0)G.counts[pIdx][d.id]=d.count;
  if(G.curP===pIdx){if(!checkDone()){G.curP=(G.curP+1)%G.players.length;G.phase='idle';G.rolls=3;G.dice=nd();G.kept=nk();G.oppDiceState=null;G.msg=G.curP===G.myIdx?'Dein Zug!':G.players[G.curP].name+' ist dran…';if(G.curP===G.myIdx)showToast(G.players[pIdx].name+' hat gespielt!');}}
  render();
}
function advance(){
  if(checkDone())return;
  G.curP=(G.curP+1)%G.players.length;G.phase='idle';G.rolls=3;G.dice=nd();G.kept=nk();G.oppDiceState=null;
  if(G.players[G.curP]?.isBot){G.phase='bot';G.msg='Bot ist dran…';render();setTimeout(botTurn,700);}
  else{G.msg=G.curP===G.myIdx?'Dein Zug!':G.players[G.curP].name+' ist dran…';render();}
}
function checkDone(){if(G.scores.every(s=>CATS.every(c=>s[c.id]!==undefined))){G.phase='gameover';render();return true;}return false;}
function botTurn(){
  const bi=G.players.findIndex(p=>p.isBot);if(bi<0)return;const bsc=G.scores[bi];
  let d=nd();let dec=botPick(d,bsc,2);if(dec?.keep)d={w:d.w.map((v,i)=>dec.keep.w[i]?v:r6()),r:dec.keep.r?d.r:r10()};
  dec=botPick(d,bsc,1);if(dec?.keep)d={w:d.w.map((v,i)=>dec.keep.w[i]?v:r6()),r:dec.keep.r?d.r:r10()};
  dec=botPick(d,bsc,0);let chosen=dec?.cat;
  const ki=isKE(d)?'lke':isKnf(d)?'lknf':null;
  if(ki&&bsc[ki]!==undefined){const base=CATS.find(c=>c.id===ki).fixed;const nc=(G.counts[bi][ki]||1)+1;G.counts[bi][ki]=nc;bsc[ki]=base*nc;const s=botScratch(bsc);if(s)bsc[s]=0;G.msg=`Bot: ${nc}× = ${bsc[ki]} Pkt!`;}
  else{if(!chosen)chosen=botScratch(bsc);if(chosen){bsc[chosen]=calcSc(chosen,d)===0?0:calcSc(chosen,d);if((chosen==='lknf'||chosen==='lke')&&bsc[chosen]>0)G.counts[bi][chosen]=1;G.msg=`Bot: ${bsc[chosen]} → "${CATS.find(c=>c.id===chosen)?.label}".`;}}
  if(checkDone())return;
  G.curP=G.myIdx;G.phase='idle';G.rolls=3;G.dice=nd();G.kept=nk();G.msg='Dein Zug!';render();
}

function switchScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
let toastT;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);}
document.getElementById('nameIn').value='Spieler'+(Math.floor(Math.random()*99)+1);
</script>
